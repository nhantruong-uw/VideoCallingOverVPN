<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Spectre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <div class="topbar">
            <h1>Spectre</h1>
            <p class="status-line" id="status"></p>
        </div>

        <div class="body">
            <aside class="sidebar">
                <h2>Peers</h2>
                <ul id="rosterList"></ul>
            </aside>

            <main class="stage" id="stage">
                <div class="incoming-call-banner" id="incomingCallBanner" hidden>
                    <span id="incomingCallText"></span>
                    <button id="acceptCallBtn">Accept</button>
                    <button id="rejectCallBtn">Reject</button>
                </div>

                <div class="tile tile-primary" id="primaryTile">
                    <video id="remoteVideo" autoplay playsinline></video>
                    <div class="tile-label" id="remoteLabel" hidden><span class="live-dot"></span>Peer</div>
                    <p class="primary-placeholder" id="primaryPlaceholder">Waiting for a call&hellip;</p>
                </div>

                <div class="tile tile-corner" id="tile-local">
                    <video id="localVideo" autoplay muted playsinline></video>
                    <div class="tile-label"><span class="live-dot"></span>You</div>
                </div>
            </main>
        </div>

        <footer class="controls">
            <div class="control-group self-status">
                <span id="selfName">You</span>
                <span class="self-you">(You)</span>
                <span id="selfOnlineText">Offline</span>
                <span class="status-dot offline" id="selfStatusDot"></span>
                <span class="quality-dot" id="selfQualityDot" hidden></span>
            </div>
            <div class="control-group">
                <label for="nameInput">Name</label>
                <input type="text" id="nameInput" placeholder="Your name">
            </div>
            <div class="control-group">
                <label for="cameraSelect">Camera</label>
                <select id="cameraSelect"></select>
            </div>
            <div class="control-group">
                <label for="micSelect">Mic</label>
                <select id="micSelect"></select>
            </div>
            <div class="control-group">
                <button id="muteBtn">Mute</button>
                <button id="cameraBtn">Turn Camera Off</button>
                <button id="disconnectBtn">Disconnect</button>
            </div>
        </footer>
    </div>

    <script type="module">
        import { startCapture, stopCapture, getCurrentStream, toggleAudio, toggleVideo, listDevices } from "./capture.js";
        import { connectSignaling, call, hangup, identify, sendMediaState, acceptCall, rejectCall } from "./webrtc.js";

        const statusEl = document.getElementById("status");
        const videoEl = document.getElementById("localVideo");
        const remoteVideoEl = document.getElementById("remoteVideo");
        const remoteLabelEl = document.getElementById("remoteLabel");
        const primaryPlaceholderEl = document.getElementById("primaryPlaceholder");
        const rosterListEl = document.getElementById("rosterList");
        const nameInput = document.getElementById("nameInput");
        const cameraSelect = document.getElementById("cameraSelect");
        const micSelect = document.getElementById("micSelect");
        const muteBtn = document.getElementById("muteBtn");
        const cameraBtn = document.getElementById("cameraBtn");
        const disconnectBtn = document.getElementById("disconnectBtn");
        const selfNameEl = document.getElementById("selfName");
        const selfOnlineTextEl = document.getElementById("selfOnlineText");
        const selfStatusDotEl = document.getElementById("selfStatusDot");
        const selfQualityDotEl = document.getElementById("selfQualityDot");
        const incomingCallBannerEl = document.getElementById("incomingCallBanner");
        const incomingCallTextEl = document.getElementById("incomingCallText");
        const acceptCallBtn = document.getElementById("acceptCallBtn");
        const rejectCallBtn = document.getElementById("rejectCallBtn");

        let selfId = null;
        let lastRosterPeers = [];
        let activeCallPeerId = null;
        let currentQuality = null;
        let peerAudioEnabled = true;
        let peerVideoEnabled = true;

        function setSelfOnline(online) {
            selfOnlineTextEl.textContent = online ? "Online" : "Offline";
            selfStatusDotEl.className = `status-dot ${online ? "online" : "offline"}`;
        }

        function renderRoster(peers) {
            lastRosterPeers = peers;
            rosterListEl.innerHTML = "";

            const self = peers.find((peer) => peer.id === selfId);
            if (self) {
                selfNameEl.textContent = self.name;
                setSelfOnline(self.online);
            }

            peers
                .filter((peer) => peer.id !== selfId)
                .sort((a, b) => a.id - b.id)
                .forEach((peer) => {
                    const li = document.createElement("li");
                    li.className = "roster-item";

                    const dot = document.createElement("span");
                    dot.className = `status-dot ${peer.online ? "online" : "offline"}`;

                    const nameEl = document.createElement("span");
                    nameEl.className = "roster-name";
                    nameEl.textContent = `${peer.name} `;

                    const idEl = document.createElement("span");
                    idEl.className = "roster-id";
                    idEl.textContent = `#${peer.id}`;

                    const callPeerBtn = document.createElement("button");
                    callPeerBtn.className = "roster-call-btn";
                    callPeerBtn.textContent = "Call";
                    callPeerBtn.disabled = !peer.online;
                    callPeerBtn.addEventListener("click", () => call(peer.id));

                    li.appendChild(dot);
                    li.appendChild(nameEl);
                    li.appendChild(idEl);

                    if (peer.id === activeCallPeerId && currentQuality) {
                        const qualityDot = document.createElement("span");
                        qualityDot.className = `quality-dot ${currentQuality}`;
                        li.appendChild(qualityDot);
                    }

                    li.appendChild(callPeerBtn);

                    rosterListEl.appendChild(li);
                });
        }

        function updateRemoteLabel() {
            let text = "Peer";
            if (!peerAudioEnabled) text += " · Muted";
            if (!peerVideoEnabled) text += " · Camera off";
            remoteLabelEl.innerHTML = `<span class="live-dot"></span>${text}`;
        }

        function showRemoteStream(stream) {
            remoteVideoEl.srcObject = stream;
            remoteLabelEl.hidden = false;
            primaryPlaceholderEl.hidden = true;
            incomingCallBannerEl.hidden = true;
            peerAudioEnabled = true;
            peerVideoEnabled = true;
            updateRemoteLabel();
        }

        function onIncomingCall(callerId) {
            const caller = lastRosterPeers.find((peer) => peer.id === callerId);
            incomingCallTextEl.textContent = `Incoming call from ${caller?.name ?? `Peer ${callerId}`}...`;
            incomingCallBannerEl.hidden = false;
        }

        function onCallRejected() {
            incomingCallBannerEl.hidden = true;
            statusEl.textContent = "Call declined.";
        }

        function clearRemoteStream() {
            remoteVideoEl.srcObject = null;
            remoteLabelEl.hidden = true;
            primaryPlaceholderEl.hidden = false;
            incomingCallBannerEl.hidden = true;
            statusEl.textContent = "The other person disconnected.";
        }

        function onRemoteTrackMuted(kind, muted) {
            statusEl.textContent = muted
                ? `Peer's ${kind} is having trouble reaching you...`
                : "";
        }

        function onPeerMediaState(kind, enabled) {
            if (kind === "audio") peerAudioEnabled = enabled;
            if (kind === "video") peerVideoEnabled = enabled;
            updateRemoteLabel();
        }

        function onQualityChange(quality, peerId) {
            currentQuality = quality;
            activeCallPeerId = peerId;

            selfQualityDotEl.hidden = quality === null;
            if (quality !== null) {
                selfQualityDotEl.className = `quality-dot ${quality}`;
            }

            renderRoster(lastRosterPeers);
        }

        async function start(constraints) {
            try {
                const stream = await startCapture(constraints, {
                    onDeviceEnded: (track) => {
                        statusEl.textContent = `Your ${track.kind} device disconnected unexpectedly.`;
                    },
                });

                videoEl.srcObject = stream;
                statusEl.textContent = "";
                muteBtn.textContent = "Mute";
                cameraBtn.textContent = "Turn Camera Off";
                disconnectBtn.textContent = "Disconnect";
                micSelect.classList.remove("av-disabled");
                cameraSelect.classList.remove("av-disabled");
            } catch (err) {
                console.error(err);

                if (err.name === "NotAllowedError") {
                    statusEl.textContent = "Camera/mic access was denied. Please allow access and reload the page.";
                } else if (err.name === "NotFoundError") {
                    statusEl.textContent = "No camera or microphone was found on this device.";
                } else if (err.name === "NotReadableError") {
                    statusEl.textContent = "Your camera or mic is already in use by another application.";
                } else if (err.name === "OverconstrainedError") {
                    statusEl.textContent = "No device matches the requested settings.";
                } else {
                    statusEl.textContent = `Could not access camera/mic: ${err.name}`;
                }
            }
        }

        function disconnect() {
            stopCapture();
            hangup();
            videoEl.srcObject = null;
            clearRemoteStream();
            muteBtn.textContent = "Mute";
            cameraBtn.textContent = "Turn Camera Off";
            disconnectBtn.textContent = "Start Camera";
            statusEl.textContent = "Disconnected.";
            micSelect.classList.remove("av-disabled");
            cameraSelect.classList.remove("av-disabled");
        }

        async function populateDeviceLists() {
            const { cameras, mics } = await listDevices();

            cameraSelect.innerHTML = "";
            micSelect.innerHTML = "";

            cameras.forEach((device) => {
                const option = document.createElement("option");
                option.value = device.deviceId;
                option.textContent = device.label || `camera (${device.deviceId.slice(0, 8)})`;
                cameraSelect.appendChild(option);
            });

            mics.forEach((device) => {
                const option = document.createElement("option");
                option.value = device.deviceId;
                option.textContent = device.label || `mic (${device.deviceId.slice(0, 8)})`;
                micSelect.appendChild(option);
            });
        }

        function selectedConstraints() {
            const video = {
                width: { ideal: 1280, max: 1280 },
                height: { ideal: 720, max: 720 },
                frameRate: { ideal: 30, max: 30 },
            };
            if (cameraSelect.value) video.deviceId = { exact: cameraSelect.value };

            return {
                video,
                audio: micSelect.value ? { deviceId: { exact: micSelect.value } } : true,
            };
        }

        await start(selectedConstraints());
        await populateDeviceLists();

        try {
            await connectSignaling({
                onRemoteStream: showRemoteStream,
                onCallEnded: clearRemoteStream,
                onRoster: renderRoster,
                onWelcome: (id) => { selfId = id; },
                onSignalingClosed: () => setSelfOnline(false),
                onRemoteTrackMuted,
                onPeerMediaState,
                onQualityChange,
                onIncomingCall,
                onCallRejected,
            });
        } catch (err) {
            console.error(err);
            statusEl.textContent = "Could not connect to the signaling server.";
        }

        cameraSelect.addEventListener("change", () => start(selectedConstraints()));
        micSelect.addEventListener("change", () => start(selectedConstraints()));

        muteBtn.addEventListener("click", () => {
            const enabled = toggleAudio();
            if (enabled === null) return;
            muteBtn.textContent = enabled ? "Mute" : "Unmute";
            micSelect.classList.toggle("av-disabled", !enabled);
            sendMediaState("audio", enabled);
        });

        cameraBtn.addEventListener("click", () => {
            const enabled = toggleVideo();
            if (enabled === null) return;
            cameraBtn.textContent = enabled ? "Turn Camera Off" : "Turn Camera On";
            cameraSelect.classList.toggle("av-disabled", !enabled);
            sendMediaState("video", enabled);
        });

        disconnectBtn.addEventListener("click", () => {
            if (getCurrentStream()) {
                disconnect();
            } else {
                start(selectedConstraints());
            }
        });

        acceptCallBtn.addEventListener("click", () => {
            incomingCallBannerEl.hidden = true;
            acceptCall();
        });

        rejectCallBtn.addEventListener("click", () => {
            incomingCallBannerEl.hidden = true;
            rejectCall();
        });

        nameInput.addEventListener("change", () => {
            const name = nameInput.value.trim();
            if (name) identify(name);
        });

        nameInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") nameInput.blur();
        });
    </script>
</body>
</html>
